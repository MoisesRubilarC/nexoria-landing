name: Desplegar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Permite que "Publicar cambios del panel" lo invoque tras fusionar.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Nunca cancelamos un despliegue en curso: si se cancela, el sitio puede
# quedarse con contenido viejo sin que nadie se entere.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          PUBLIC_ENDPOINT_COTIZACION: ${{ vars.PUBLIC_ENDPOINT_COTIZACION }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
