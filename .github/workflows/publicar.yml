name: Publicar cambios del panel

# El panel /admin guarda en la rama "borrador", que NO publica nada.
# Acá se juntan todos esos cambios y se suben al sitio de una vez.
# Para usarlo: pestaña Actions → "Publicar cambios del panel" → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fusionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Juntar lo del panel con el sitio
        run: |
          git config user.name "Panel Nexoria"
          git config user.email "contacto@nexoriachile.com"

          if ! git ls-remote --exit-code --heads origin borrador > /dev/null; then
            echo "No existe la rama 'borrador'. Nada que publicar."
            exit 0
          fi

          git fetch origin borrador
          git merge origin/borrador --no-edit -m "Publica los cambios hechos en el panel"
          git push origin main

          # Dejamos 'borrador' al día con el sitio, para que la próxima
          # tanda parta desde lo que está realmente publicado.
          git push origin main:borrador

  desplegar:
    needs: fusionar
    uses: ./.github/workflows/deploy.yml
